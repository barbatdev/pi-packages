name: Release smoke

on:
  pull_request:
    paths: [".github/workflows/release-smoke.yml", ".github/workflows/publish.yml", "scripts/release-smoke.mjs", "packages/safe-ops/**", "package.json", "pnpm-lock.yaml", "docs/releasing.md"]
  push:
    branches: [main]
    paths: [".github/workflows/release-smoke.yml", ".github/workflows/publish.yml", "scripts/release-smoke.mjs", "packages/safe-ops/**", "package.json", "pnpm-lock.yaml", "docs/releasing.md"]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact protected-main commit SHA to rerun
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUSH_AFTER: ${{ github.event.after }}
      MANUAL_SHA: ${{ inputs.sha }}
      BOUND_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
      SMOKE_NAME: release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE: docker.io/library/node@sha256:f2bf1588ef7e8dd183d9e4cb4330a0d952204b7348ead42afb1aab11f9c4911b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BOUND_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bind checkout to the event
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          test "$HEAD" = "$BOUND_SHA"
          case "$EVENT_NAME" in
            pull_request) test "$BOUND_SHA" = "$PR_HEAD_SHA" ;;
            push) test "$BOUND_SHA" = "$GITHUB_SHA"; test "$BOUND_SHA" = "$PUSH_AFTER" ;;
            workflow_dispatch)
              test "$EVENT_REF" = "refs/heads/main"
              [[ "$BOUND_SHA" =~ ^[a-f0-9]{40}$ ]]
              [[ "$MANUAL_SHA" =~ ^[a-f0-9]{40}$ ]]
              test "$BOUND_SHA" = "$GITHUB_SHA"; test "$BOUND_SHA" = "$MANUAL_SHA"
              test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MANUAL_SHA"
              ;;
            *) exit 1 ;;
          esac
      - name: Bootstrap pinned tools
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_ROOT="$RUNNER_TEMP/$SMOKE_NAME"
          mkdir -p "$SMOKE_ROOT/tools" "$SMOKE_ROOT/work"
          docker run --rm --user "$(id -u):$(id -g)" --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 1g --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,size=64m --tmpfs /smoke-home:rw,noexec,nosuid,size=64m --env HOME=/smoke-home --env npm_config_cache=/smoke-home/.npm -v "$SMOKE_ROOT/tools:/tools" "$IMAGE" sh -c 'test "$(node --version)" = v22.19.0; npm install --prefix /tools --ignore-scripts --legacy-peer-deps --no-audit --no-fund --loglevel=error --package-lock=false npm@11.16.0 @earendil-works/pi-coding-agent@0.82.1'
      - name: Run isolated smoke
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_ROOT="$RUNNER_TEMP/$SMOKE_NAME"
          docker run --rm --network none --user "$(id -u):$(id -g)" --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 1g --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,size=64m --tmpfs /smoke-home:rw,noexec,nosuid,size=64m --env HOME=/smoke-home --env npm_config_cache=/smoke-home/.npm --env RELEASE_SMOKE_SHA="$BOUND_SHA" -v "$GITHUB_WORKSPACE:/repo:ro" -v "$SMOKE_ROOT/tools:/tools:ro" -v "$SMOKE_ROOT/work:/work" "$IMAGE" sh -c 'test "$(node --version)" = v22.19.0; node /repo/scripts/release-smoke.mjs'
      - name: Remove smoke state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_ROOT="$RUNNER_TEMP/$SMOKE_NAME"
          case "$SMOKE_ROOT" in "$RUNNER_TEMP"/release-smoke-*) rm -rf "$SMOKE_ROOT" ;; *) exit 1 ;; esac
          test ! -e "$SMOKE_ROOT"
